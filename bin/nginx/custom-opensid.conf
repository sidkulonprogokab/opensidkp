# 1. Intercept 'desa' directory and explicitly forbid any internal PHP files
location ^~ /desa/ {
    location ~* \.php$ {
        deny all;
        return 403;
    }
    # Allow all other static files (images, files, etc) inside /desa/ to serve normally
    try_files $uri $uri/ =404;
}

# 2. Intercept 'storage' directory and explicitly forbid any internal PHP files
location ^~ /storage/ {
    location ~* \.php$ {
        deny all;
        return 403;
    }
    # Allow all other static files inside /storage/ to serve normally
    try_files $uri $uri/ =404;
}
