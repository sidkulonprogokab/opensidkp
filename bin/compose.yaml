services:
  web:
    image: opensidkp:26.04-ssl
    container_name: ${APP_CONTAINER}_app
    ports:
      - "${APP_PORT}:8443"
    volumes:
      - ./${APP_CONTAINER}/desa:/var/www/html/public/desa
    environment:
      SSL_MODE: "full"
      PHP_DATE_TIMEZONE: "Asia/Jakarta"
      PHP_OPCACHE_ENABLE: "1"
      PHP_FPM_PM_START_SERVERS: "5"
      PHP_FPM_PM_MIN_SPARE_SERVERS: "5"
      PHP_FPM_PM_MAX_SPARE_SERVERS: "10"
      PHP_FPM_PM_MAX_CHILDREN: "50"
      PHP_FPM_PM_MAX_REQUESTS: "500"
    networks:
      - desa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --insecure --silent --location --show-error --fail https://localhost:8443 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  desa-network:
    external: true
